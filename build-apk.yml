name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The zip only holds lib/, test/ and pubspec.yaml - generate the Android project around them.
      - run: flutter create . --platforms=android --project-name jewellery_pos --org in.jewellerypos
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
        continue-on-error: true
      - run: flutter test
        continue-on-error: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: jewellery-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
